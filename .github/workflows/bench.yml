name: Benchmark

# Compares the crypto benchmarks (bbs/, bccsp/schemes/aries/, bccsp/) between a PR's merge
# base and its head, and posts the benchstat delta as a PR comment. This is informational
# only — GitHub-hosted runners are too noisy for absolute ns/op thresholds, so this job never
# fails the build. It exists so a regression like the one fixed by this workflow's own
# introduction (an accidental switch from a pairwise loop to an unconditional
# multi-scalar-multiplication call, which regressed small-input hot paths ~4x) shows up in
# review instead of being caught after release.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark PR head
        run: |
          go test ./bbs/... ./bccsp/schemes/aries/... ./bccsp/... \
            -run '^$' -bench . -benchtime 100x -count 5 -cpu 1 | tee /tmp/head.txt

      - name: Benchmark merge base
        run: |
          git checkout "${{ github.event.pull_request.base.sha }}"
          go test ./bbs/... ./bccsp/schemes/aries/... ./bccsp/... \
            -run '^$' -bench . -benchtime 100x -count 5 -cpu 1 | tee /tmp/base.txt || true
          git checkout "${{ github.event.pull_request.head.sha }}"
        if: github.event_name == 'pull_request'

      - name: Compare
        if: github.event_name == 'pull_request'
        run: |
          benchstat /tmp/base.txt /tmp/head.txt | tee /tmp/benchstat.txt

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('/tmp/benchstat.txt', 'utf8');
            const body = "### Benchmark comparison (base vs. this PR)\n\n" +
              "_Informational only — noisy GitHub runners, not a merge gate._\n\n" +
              "```\n" + out + "\n```";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
