name: Go Fix Check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Check for go fix suggestions
        run: make gofix
